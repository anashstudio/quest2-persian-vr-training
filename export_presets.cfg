[preset.0]
name="Meta Quest 2 - Android ARM64"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/Quest2-Persian-VR-Training.apk"
patch_list=PackedStringArray()

[preset.0.options]
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk="29"
gradle_build/target_sdk="35"
custom_template/debug=""
custom_template/release=""
keystore/debug=""
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
keystore/release="res://release.keystore"
keystore/release_user="quest2"
keystore/release_password="quest2release"
package/unique_name="ir.isfahanrefinery.vrtraining"
package/name="آموزش کاربری هدست واقعیت مجازی"
package/signed=true
package/app_category=0
package/retain_data_on_uninstall=false
package/show_in_app_library=true
launcher_icons/main_192x192="res://assets/icon.png"
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
architecture/arm64-v8a=true
architecture/armeabi-v7a=false
screen/immersive_mode=true
